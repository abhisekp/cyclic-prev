name: Deploy playground
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'abhisekp/cyclic-prev' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Update generated gh-pages branch
        run: |
          gh auth setup-git --hostname github.com
          git init .pages-branch
          git -C .pages-branch remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          remote_ref=$(git -C .pages-branch ls-remote --heads origin gh-pages)
          if [ -n "$remote_ref" ]; then
            git -C .pages-branch fetch --depth=1 origin gh-pages
            git -C .pages-branch checkout -b gh-pages FETCH_HEAD
            git -C .pages-branch ls-files -z | xargs -0 -r git -C .pages-branch rm -f --
          else
            git -C .pages-branch checkout --orphan gh-pages
          fi
          cp -a _site/. .pages-branch/
          git -C .pages-branch config user.name 'github-actions[bot]'
          git -C .pages-branch config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .pages-branch add -A
          if ! git -C .pages-branch diff --cached --quiet; then
            git -C .pages-branch commit -m "Deploy playground from $GITHUB_SHA"
            git -C .pages-branch push origin HEAD:gh-pages
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
